# Builds installers for all three QForge apps on GitHub's Windows and Mac machines:
#   QForge (show control) · QForge Stage Manager · QForge Output
# Windows: setup .exe (Start menu + desktop shortcuts, uninstaller)
# macOS:   .dmg for Apple Silicon and for Intel (drag to Applications)
# - Every push to main (and Run workflow in the Actions tab) builds them as downloadable artifacts.
# - Publish a GitHub release: the installers are attached to that release automatically.
name: Build installers

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.app.name }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        app:
          - { name: QForge, dir: . }
          - { name: Stage Manager, dir: apps/stage-manager }
          - { name: Output, dir: apps/output }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.app.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish never
      - name: Build Mac installers
        if: runner.os == 'macOS'
        run: npm run dist:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}-${{ runner.os }}
          path: |
            ${{ matrix.app.dir }}/dist/*.exe
            ${{ matrix.app.dir }}/dist/*.dmg
          if-no-files-found: error
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg)
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber
