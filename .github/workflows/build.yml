# Builds installers for all three QForge apps on GitHub's Windows and Mac machines:
#   QForge (show control) · QForge Stage Manager · QForge Output
# Windows: setup .exe (Start menu + desktop shortcuts, uninstaller)
# macOS:   .dmg for Apple Silicon and for Intel (drag to Applications)
# - Every push to main (and Run workflow in the Actions tab) builds them, then publishes them as the
#   release named after the version in package.json (e.g. v1.6.0), replacing that release's files.
# - NDI®: the native bridge (native/ndi) is compiled on each machine first and packed into every app.
# - Publish a GitHub release: the installers are attached to that release automatically.
name: Build installers

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.app.name }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        app:
          - { name: QForge, dir: . }
          - { name: Stage Manager, dir: apps/stage-manager }
          - { name: Output, dir: apps/output }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.app.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the NDI® bridge
        working-directory: .
        run: |
          node native/ndi/build.js
          # check it loads, and on macOS that the bundled NDI runtime starts
          node -e "const n=require('./native/ndi/dist/qforge_ndi.node'); const lib=process.platform==='darwin'?'./native/ndi/dist/libndi.dylib':''; console.log('bridge ok', lib ? n.load(require('path').resolve(lib)) : Object.keys(n))"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish never
      - name: Build Mac installers
        if: runner.os == 'macOS'
        run: npm run dist:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}-${{ runner.os }}
          path: |
            ${{ matrix.app.dir }}/dist/*.exe
            ${{ matrix.app.dir }}/dist/*.dmg
          if-no-files-found: error
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg)
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber

  # After every app builds: publish them as the release for the version in package.json
  release:
    name: Publish release
    needs: build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Old releases to remove (and their tags). Leave empty once they are gone.
      REMOVE_RELEASES: ""
    steps:
      - uses: actions/checkout@v4
      - name: Collect the installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish
        shell: bash
        run: |
          set -e
          V="v$(node -p "require('./package.json').version")"
          ls -la installers
          for old in $REMOVE_RELEASES; do
            if [ "$old" != "$V" ] && gh release view "$old" >/dev/null 2>&1; then
              echo "Removing release $old"; gh release delete "$old" --cleanup-tag --yes
            elif [ "$old" != "$V" ]; then
              git push origin ":refs/tags/$old" 2>/dev/null || true
            fi
          done
          NOTES="docs/release-notes-${V#v}.md"
          [ -f "$NOTES" ] || { echo "# QForge ${V#v}" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          shopt -s nullglob
          files=(installers/*.exe installers/*.dmg)
          if gh release view "$V" >/dev/null 2>&1; then
            echo "Updating release $V"
            gh release edit "$V" --title "QForge ${V#v}" --notes-file "$NOTES"
            gh release upload "$V" "${files[@]}" --clobber
          else
            echo "Creating release $V"
            gh release create "$V" "${files[@]}" --target "$GITHUB_SHA" --title "QForge ${V#v}" --notes-file "$NOTES" --latest
          fi
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$V"
